{#- Tela de acesso: esqueleto herdado de base_auth.html. -#}
{% extends "auth/base_auth.html" %}

{% block head_extra %}
  <link rel="stylesheet" href="/css/login.css">
{% endblock %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}

    <div class="container">

        <div class="logo">

            <img src="/assets/img/Logo senai.png" alt="Logo SENAI">

        </div>


        <div class="hr"></div>


        <div class="form-container">

            <h2>
                Gestão de salas e equipamentos
            </h2>


            <form>

                <!-- EMAIL -->

                <div class="input-container">

                    <i class="bi bi-envelope"></i>

                    <input type="email" id="email" placeholder="Email..." required>

                </div>


                <!-- SENHA -->

                <div class="input-container">

                    <i class="bi bi-lock"></i>

                    <input type="password" id="senha" placeholder="Senha..." required>

                </div>


                <!-- BOTÃO -->

                <button type="submit">
                    Entrar
                </button>

            </form>


            <div class="links">

                <!-- Não há autocadastro: quem cria conta é o Coordenador,
                     dentro da área dele. O link para /cadastro ficava aqui
                     e levava o visitante de volta ao login. -->

                <p>

                    <a href="/esqueceu_senha">
                        Esqueci minha senha
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

{% endblock %}

{% block scripts %}
    <script type="module" src="/js/login.js"></script>


{% endblock %}
