<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/cadastro.css">

    <title>SENAI - Gestão de Salas e Equipamentos</title>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/assets/img/Logo senai.png">
        </div>
        <div class="hr"></div>
        <div class="form-container">
            <h2>Gestão de salas e equipamentos</h2>
            
            <form action="/" method="GET">

            <form>

                <div class="input-container">
                    <i class="bi bi-person-circle"></i>
                    <input type="text" id="nome" placeholder="Nome completo...">
                </div>

                <div class="input-container">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" placeholder="Email...">
                </div>

                <div class="input-container">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="senha" placeholder="Senha...">
                </div>

                <div class="input-container">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="confirmar-senha" placeholder="Confirme sua senha...">
                </div>

                <button type="submit" id="btn_cadastro">
                    Criar Conta
                </button>

            </form>

            <div class="divider">
                ou
            </div>

            <div class="links">
                <p>
                    <a href="/">
                        Já possui conta? Faça o login
                    </a>
                </p>
            </div>

        </div>
    </div>

    <script type="module" src="/js/cadastro.js"></script>

</body>
</html>
