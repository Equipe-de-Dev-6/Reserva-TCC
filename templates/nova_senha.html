<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/nova_senha.css">

    <title>SENAI - Gestão de Salas e Equipamentos</title>

</head>

<body>

    <div class="container">

        <div class="logo">

            <img src="/assets/img/Logo senai.png">

        </div>

        <div class="hr"></div>

        <div class="form-container">

            <h2>Gestão de salas e equipamentos</h2>
            <h2>Redefina sua senha</h2>
            <h2>Insira sua nova senha a seguir</h2>

            <form>

                <!-- Nova senha -->
                <div class="input-container">
                    <i class="bi bi-lock"></i>
                    <input type="password" placeholder="Senha">
                </div>

                <!-- Repetir Senha -->
                <div class="input-container">
                    <i class="bi bi-lock"></i>
                    <input type="password" placeholder="Repita a senha">
                </div>

                <button type="submit">Confirmar</button>

            </form>

            <a class="links" href="/templates/login.html">Voltar ao login</a>

        </div>

    </div>

</body>

</html>
