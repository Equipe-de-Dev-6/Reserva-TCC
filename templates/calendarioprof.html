<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendário - Gestão de salas e equipamentos</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://www.flaticon.com/flaticon.css">
  <link rel="stylesheet" href="/css/calendarioprof.css">
</head>

<body>
  <div class="app-container">

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="sidebar-top">

        <a href="/calendario_prof" class="logo">
          <img src="/assets/img/Logo senai.png" alt="Logo SENAI">
        </a>

        <nav class="nav-menu">
          <a href="/home" class="nav-item">
            <img src="/assets/icons/home.png" alt="" width="20" height="20">
            Início
          </a>

          <a href="/reservar" class="nav-item">
            <img src="/assets/icons/restaurant.png" alt="" width="20" height="20">
            Reservar
          </a>

          <a href="/reservas_prof" class="nav-item">
            <img src="/assets/icons/reserved.png" alt="" width="20" height="20">
            Reservas
          </a>

          <a href="/calendario_prof" class="nav-item active">
            <img src="/assets/icons/calendar.png" alt="" width="20" height="20">
            Calendário
          </a>

          <a href="/notificacoes_prof" class="nav-item">
            <img src="/assets/icons/notification.png" alt="" width="20" height="20">
            Notificações
          </a>

          <!-- Avisos -->
          <a href="/avisos" class="nav-item">
            <img src="/assets/icons/warning.png" alt="" width="20" height="20">
            Avisos
          </a>

          <!-- Configurações -->
          <a href="/configuracoes" class="nav-item">
            <img src="/assets/icons/gear.png" alt="" width="20" height="20">
            Configurações
          </a>
        </nav>

        <div class="divider"></div>

        <!-- Ajuda -->
        <a href="/ajuda" class="nav-item">
          <img src="/assets/icons/interrogation.png" alt="" width="20" height="20">
          Ajuda
        </a>
      </div>

      <form method="POST" action="/logout" class="logout-form">
        <button type="submit" class="btn-logout">
          <img src="/assets/icons/exit.png" alt="" width="20" height="20">
          Sair
        </button>
      </form>
    </aside>

    <main class="main-content">

      <header class="header">

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            viewBox="0 0 24 24">
            <path d="M3 6h18M3 12h18M3 18h18"></path>
          </svg>
        </button>

        <div class="greeting">
          <h1><span id="nomeUsuario"></span></h1>
          <p>
            Gerencie suas reservas e faça novos agendamentos
          </p>
        </div>

        <div class="header-actions">

          <div class="search-container">
            <svg width="18" height="18" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>

            <input type="text" id="search-input" placeholder="Buscar salas, carrinhos, laboratórios...">
          </div>

          <a href="/notificacoes_prof" class="icon-btn">
            <img src="/assets/icons/notification (2).png" alt="Notificações" width="20" height="20">
          </a>

          <div class="user-profile" id="userProfile">

            <div class="avatar-link">
              <div class="avatar">
                <img src="/assets/icons/user (3).png" alt="Perfil do Usuário" width="28" height="28">
              </div>
            </div>

            <div class="user-info">
              <span class="name" id="nomePerfil">...</span>
              <span class="role">Professor</span>
            </div>

            <div class="user-dropdown" id="userDropdown">

              <a href="/reservas_prof" class="dropdown-item">
                Minhas Reservas
              </a>

              <!-- Configurações -->
              <a href="/configuracoes" class="dropdown-item">
                Configurações
              </a>

              <div class="dropdown-divider"></div>

              <form method="POST" action="/logout">
                <button type="submit">
                  Sair
                </button>
              </form>
            </div>

          </div>
        </div>
      </header>

      <section class="calendar-section">

        <h2>Calendário de Reservas</h2>

        <div class="calendar-page-layout">

          <div class="calendar-card">

            <div class="calendar-nav">
              <button class="calendar-nav-btn" id="calPrev" aria-label="Mês anterior">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M15 18l-6-6 6-6"></path>
                </svg>
              </button>

              <span class="calendar-month-label" id="calMonthLabel">
                Mês Ano
              </span>

              <button class="calendar-nav-btn" id="calNext" aria-label="Próximo mês">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M9 18l6-6-6-6"></path>
                </svg>
              </button>
            </div>

            <div class="calendar-grid-header">
              <span>Dom</span>
              <span>Seg</span>
              <span>Ter</span>
              <span>Qua</span>
              <span>Qui</span>
              <span>Sex</span>
              <span>Sáb</span>
            </div>

            <div class="calendar-grid" id="calendarGrid">
              <!-- Renderizado dinamicamente via JS -->
            </div>

          </div>

          <aside class="calendar-day-panel">

            <h3 id="dayPanelTitle">
              Reservas - Dia --
            </h3>

            <p class="day-panel-subtitle" id="dayPanelSubtitle">
              --
            </p>

            <div id="dayPanelList">
              <!-- Renderizado dinamicamente via JS -->
            </div>

            <a href="/reservar" class="btn-nova-reserva-dia">
              + Solicitar Nova Reserva
            </a>

          </aside>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/reservas.js"></script>

  <script type="module" src="/js/usuario.js"></script>
<script type="module" src="/js/pages/calendarioprof.js"></script>
</body>

</html>
